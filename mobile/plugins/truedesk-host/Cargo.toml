[package]
name = "tauri-plugin-truedesk-host"
version = "0.1.0"
description = "Share and control this Android device from a Truedesk viewer."
edition = "2021"
license = "AGPL-3.0-only"
publish = false
links = "tauri-plugin-truedesk-host"

[dependencies]
tauri = { version = "2.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

# The hosting engine and its JNI exports are linked into the app library on
# Android; the plugin pins the symbols so Kotlin can resolve them.
[target.'cfg(target_os = "android")'.dependencies]
android-host = { path = "../../../crates/android-host" }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
