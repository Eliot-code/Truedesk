name: Android app

# Builds the Truedesk viewer for Android (the browser viewer in a Tauri 2
# app, see mobile/) and uploads a signed APK. To sign with your own key, so
# installed apps can update in place, set the repo secrets ANDROID_KEYSTORE
# (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS.
# Without them each build is signed with a throwaway key.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - "web/**"
      - "crates/web-core/**"
      - "crates/protocol/**"
      - "crates/host-core/**"
      - "crates/android-host/**"
      - "viewer/src/lib/**"
      - "viewer/src/components/TouchKeyboard.tsx"
      - "viewer/src/styles.css"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "web/**"
      - "crates/web-core/**"
      - "crates/protocol/**"
      - "crates/host-core/**"
      - "crates/android-host/**"
      - "viewer/src/lib/**"
      - "viewer/src/components/TouchKeyboard.tsx"
      - "viewer/src/styles.css"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            mobile/src-tauri -> target
      # Must match the wasm-bindgen version pinned in crates/web-core.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json

      # The app shows the browser viewer, which loads this wasm build.
      - name: Build the viewer's wasm
        working-directory: web
        run: |
          npm ci
          npm run wasm

      # The runner image has the Android SDK, NDK and JDK 17. The app's
      # Android project is generated, not kept in the repo.
      - name: Build the APK
        working-directory: mobile
        env:
          # Baked into the viewer like the desktop app; without it the app
          # starts with a local development relay to change in its settings.
          TRUEDESK_DEFAULT_RELAY: ${{ vars.TRUEDESK_DEFAULT_RELAY }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64" NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm ci
          npx tauri android init --ci
          npx tauri icon ../viewer/src-tauri/icons/icon.png
          npx tauri android build --apk --target aarch64 --target armv7

      - name: Sign the APK
        working-directory: mobile
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          unsigned="$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -n 1)"
          [ -n "$unsigned" ] || { echo "::error::No unsigned release APK was built"; exit 1; }
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::ANDROID_KEYSTORE is not set: signing with a throwaway key. Installed apps won't update to this build; uninstall them first."
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)" KEY_ALIAS=truedesk
            "$JAVA_HOME_17_X64/bin/keytool" -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Truedesk"
          fi
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out Truedesk.apk "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs Truedesk.apk
          rm -f "$RUNNER_TEMP/release.jks"
          ls -l Truedesk.apk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: truedesk-android
          path: mobile/Truedesk.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach the APK to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: truedesk-android
      # release.yml publishes the same tag; whichever runs first creates it.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "" --prerelease
          mv Truedesk.apk "Truedesk_${TAG#v}_android.apk"
          gh release upload "$TAG" "Truedesk_${TAG#v}_android.apk" --repo "$GITHUB_REPOSITORY" --clobber
