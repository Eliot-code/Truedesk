name: Release unsigned bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned ${{ matrix.os }} bundle
    runs-on: ${{ matrix.os }}
    # audiopus_sys's bundled opus CMakeLists predates CMake 4 (RUSTSEC-2026-0150).
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-24.04
          - windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libopus-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libdbus-1-dev \
            clang

      - name: Install macOS audio dependency (libopus for the opus crate)
        if: runner.os == 'macOS'
        run: brew install opus
      # Windows: audiopus_sys builds libopus from source via CMake (present on
      # windows-latest); no extra install step is needed.

      - name: Install frontend dependencies
        working-directory: viewer
        run: npm ci

      # These bundles are intentionally unsigned. No signing identities,
      # certificates, notarization, or Windows signing secrets are used.
      - name: Build unsigned Tauri bundles
        working-directory: viewer
        run: npm run tauri build

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v7
        with:
          name: opendesk-${{ runner.os }}-unsigned
          path: viewer/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned release artifacts
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      # Release assets remain unsigned; users may need to bypass Gatekeeper,
      # SmartScreen, or Linux desktop trust prompts when launching them.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/**/*
