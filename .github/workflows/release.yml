name: Release unsigned bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned ${{ matrix.os }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Install frontend dependencies
        working-directory: viewer
        run: npm ci

      # These bundles are intentionally unsigned. No signing identities,
      # certificates, notarization, or Windows signing secrets are used.
      - name: Build unsigned Tauri bundles
        working-directory: viewer
        run: npm run tauri build

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: opendesk-${{ runner.os }}-unsigned
          path: viewer/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned release artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      # Release assets remain unsigned; users may need to bypass Gatekeeper,
      # SmartScreen, or Linux desktop trust prompts when launching them.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/**/*
