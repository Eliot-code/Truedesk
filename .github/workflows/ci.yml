name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust protocol and relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p protocol -p relay
      - run: cargo test -p protocol -p relay
      - run: cargo clippy -p protocol -p relay --all-targets -- -D warnings

  host-core:
    name: Rust host-core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: brew install opus
      - run: cargo build -p host-core
      - run: cargo test -p host-core
      - run: cargo clippy -p host-core --all-targets -- -D warnings

  tauri:
    name: Tauri Rust crate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: viewer/src-tauri -> viewer/src-tauri/target
      - run: brew install opus
      - run: cargo check --manifest-path viewer/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path viewer/src-tauri/Cargo.toml --all-targets -- -D warnings

  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - run: npx vitest run
        working-directory: viewer

  # First-ever cross-compile of the cfg-gated Windows/Linux host code
  # (scap/enigo/cpal). These paths are never built on macOS, so this job is
  # where platform compile errors surface. `check` only; running capture/input
  # needs a real desktop session.
  host-core-cross:
    name: host-core (${{ matrix.os }})
    # audiopus_sys's bundled opus CMakeLists predates CMake 4 (RUSTSEC-2026-0150).
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio/input deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev libasound2-dev libxdo-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev clang
      # Windows: audiopus_sys builds libopus from source via CMake (preinstalled
      # on windows-latest; see env above); enigo/scap need no extra deps.
      - run: cargo check -p protocol -p relay -p host-core

  tauri-cross:
    name: tauri backend (${{ matrix.os }})
    # audiopus_sys's bundled opus CMakeLists predates CMake 4 (RUSTSEC-2026-0150).
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: viewer/src-tauri -> viewer/src-tauri/target
      - name: Linux Tauri + audio deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libopus-dev libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev clang
      - run: cargo check --manifest-path viewer/src-tauri/Cargo.toml

  cargo-deny:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
