# Monthly, one grouped PR per ecosystem, so updates are reviewed without
# flooding CI. Security fixes still arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directories: [/, /viewer/src-tauri]
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      cargo: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: [/viewer, /site]
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /crates/relay
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
